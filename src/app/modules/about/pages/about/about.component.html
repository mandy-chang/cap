<mat-toolbar color="primary" class="mat-elevation-z5">
  <div fxFlex fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px" class="toolbar-row">
    <button type="button" aria-label="Go Back" mat-icon-button (click)="goBack()"
      matTooltip="Go Back">
      <mat-icon aria-label="Go Back">arrow_back</mat-icon>
    </button>
    <span>About {{APP_CONSTS.TITLE}}</span>
  </div>
</mat-toolbar>
<div class="page-content text-content" fxLayout="column" fxLayoutGap="16px">
  <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="16px">
    <img src="assets/img/BudgetU2.png" alt="BudgetU2 Logo" width="200">
  </div>
  <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="16px">
    <p>BudgetU is a personal finance app that helps you manage your budget, track your expenses, and plan for your financial future.</p>
  </div>
  <div fxLayout="row" fxLayoutAlign="center center" fxLayoutGap="16px">
    <p></p>
  </div>
